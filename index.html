<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles/index_styles.css">
    <title>Home Page</title>
</head>

<body>
    <header>
        <h1>Welcome to jacobmorgan.space!
        </h1>
        <h2>On this page, you will find some brief information about me, my projects, and what I
            like to do in my free time. Happy browsing!
        </h2>
    </header>
    <nav>
        <a href="pages/school_home.html" class="nav-button">Visit my School Homepage</a>
    </nav>
    <p><span id="post"></span></p>
    
            <!-- Input field and submit button -->
    <input type="text" id="userInput" placeholder="Enter something here...">
    <button onclick="saveAndDisplay()">Add</button>

    <!-- Container where the lines will be displayed -->
    <div id="listContainer"></div>

    <script>
        <script>
        let name = prompt("Please enter your username")
        let password = prompt("Please enter your password")
        if (name == "Jacob" && password == "1234") {
                
            // 1. Load existing items from localStorage when the page opens
            window.onload = function() {
                displayStoredItems();
            };

            function saveAndDisplay() {
                const inputField = document.getElementById('userInput');
                const newValue = inputField.value.trim();

                if (newValue === '') return; // Don't add empty lines

                // 2. Get existing items or initialize an empty array
                let storedItems = JSON.parse(localStorage.getItem('myLines')) || [];

                // 3. Add the new value to the FRONT of the array (so new is on top)
                storedItems.unshift(newValue);

                // 4. Save the updated array back to localStorage
                localStorage.setItem('myLines', JSON.stringify(storedItems));

                // 5. Refresh the display and clear the input box
                displayStoredItems();
                inputField.value = '';
            }

            function displayStoredItems() {
                const container = document.getElementById('listContainer');
                let storedItems = JSON.parse(localStorage.getItem('myLines')) || [];

                // Clear the current display to prevent duplicates
                container.innerHTML = '';

                // 6. Loop through and create HTML elements for each item
                storedItems.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.textContent = item;
                    container.appendChild(div);
                });
            }
        </script>

        }
    <footer>
        <!--&#169; is the copyright symbol, &#8212; is the em dash.-->
        <p>&#169; 2026 <span id="year"></span> Jacob Morgan. All Rights Reserved.</p>

        <script>
            let currentYear = new Date().getFullYear();
            if (currentYear > 2026) {
                document.getElementById("year").textContent = "—" + currentYear;
            }
        </script>
    </footer>
</body>

</html>
